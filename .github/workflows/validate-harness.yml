name: Validate harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test harness and skill workflows
        run: python3 -m unittest discover -s tests -v
      - name: Check native skill adapters
        run: python3 scripts/sync_skills.py --check
      - name: Check standalone skill packages
        run: python3 scripts/build_workbooks.py --check
      - name: Check whitespace
        run: git diff --check
